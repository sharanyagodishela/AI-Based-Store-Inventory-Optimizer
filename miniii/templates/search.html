<!DOCTYPE html>
<html>

<head>
    <title>Search Product</title>
    <!-- Link your main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Table styling */
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        /* Alternate row colors */
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        /* Highlight row on hover */
        tbody tr:hover {
            background-color: #ffeb99;
            cursor: pointer;
        }

        /* Form and button styling */
        form {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 8px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            margin-left: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #45a049;
        }

        h2, h3 {
            text-align: center;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h2>Search Product</h2>

<form method="POST">
    <input type="text" name="keyword" placeholder="Enter product name">
    <button type="submit">Search</button>
</form>

{% if products %}
<h3>Results</h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Stock</th>
            <th>Price</th>
            <th>Sales</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.stock }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.sales }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endif %}

<a href="{{ url_for('dashboard') }}">
    <button>Back to Dashboard</button>
</a>

</body>
</html>
