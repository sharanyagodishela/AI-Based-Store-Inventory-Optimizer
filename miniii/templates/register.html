<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Store Optimizer</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.error { color: red; font-size: 14px; }
.success { color: green; }
.password-strength { font-size: 13px; margin-top: 5px; }
</style>

</head>

<body class="login-body">

<div class="login-container">

<h2>Create Account</h2>

<!-- FLASH MESSAGES -->
{% with messages = get_flashed_messages() %}
{% if messages %}
<div style="background:#d4edda; color:#155724; padding:10px; border:1px solid #c3e6cb; margin-bottom:15px;">
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
</div>
{% endif %}
{% endwith %}

<form action="{{ url_for('register') }}" method="POST" onsubmit="return validateForm()">

<!-- Username -->
<div class="form-group">
<label>Username</label>
<input type="text" name="username" id="username" placeholder="Enter username" required>
</div>

<!-- Email -->
<div class="form-group">
<label>Email</label>
<input type="email" name="email" id="email" placeholder="Enter email" required>
</div>

<!-- Password -->
<div class="form-group">
<label>Password</label>
<input type="password" name="password" id="password" required onkeyup="checkStrength()">
<div class="password-strength" id="strength"></div>
</div>

<!-- Confirm Password -->
<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirm_password" required>
</div>

<!-- Show Password -->
<div class="form-group">
<input type="checkbox" onclick="togglePassword()"> Show Password
</div>

<div id="error-message" class="error"></div>

<br>

<button type="submit" class="login-btn">Register</button>

</form>

<br>

<p>Already have an account? 
<a href="{{ url_for('login_page') }}">Login here</a>
</p>

</div>

<script>

// Toggle Password
function togglePassword() {
    let pass = document.getElementById("password");
    let confirm = document.getElementById("confirm_password");

    pass.type = pass.type === "password" ? "text" : "password";
    confirm.type = confirm.type === "password" ? "text" : "password";
}

// Validate Form
function validateForm() {
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm_password").value;
    let error = document.getElementById("error-message");

    error.innerText = "";

    // Username validation
    if (username.length < 3) {
        error.innerText = "Username must be at least 3 characters";
        return false;
    }

    // Email validation
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!email.match(emailPattern)) {
        error.innerText = "Enter a valid email address";
        return false;
    }

    // Password match
    if (pass !== confirm) {
        error.innerText = "Passwords do not match!";
        return false;
    }

    // Password strength check
    if (pass.length < 6) {
        error.innerText = "Password must be at least 6 characters";
        return false;
    }

    return true;
}

// Password Strength
function checkStrength() {
    let pass = document.getElementById("password").value;
    let strength = document.getElementById("strength");

    if (pass.length < 6) {
        strength.innerHTML = "Weak password";
        strength.style.color = "red";
    } 
    else if (pass.match(/[A-Z]/) && pass.match(/[0-9]/) && pass.match(/[@$!%*?&]/)) {
        strength.innerHTML = "Strong password";
        strength.style.color = "green";
    } 
    else {
        strength.innerHTML = "Medium strength";
        strength.style.color = "orange";
    }
}

</script>

</body>
</html>
